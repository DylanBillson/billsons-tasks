{% if flash_messages %}

<div class="flash-messages">

    {% for message in flash_messages %}

    <div
        class="alert alert-{{ message.category }}"
        role="alert"
    >

        {% if message.title %}
        <div class="alert-title">
            {{ message.title }}
        </div>
        {% endif %}

        <div class="alert-body">
            {{ message.message }}
        </div>

    </div>

    {% endfor %}

</div>

{% endif %}
