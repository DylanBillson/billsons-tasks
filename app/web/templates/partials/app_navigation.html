{% if current_user is defined and current_user %}

<nav
    class="app-navigation"
    aria-label="Primary navigation"
>

    <div class="app-navigation-inner">

        <div class="app-navigation-primary">

            <a
                href="{{ url_for('home') }}"
                class="app-navigation-link{% if request.url.path == '/' %} is-active{% endif %}"
                {% if request.url.path == '/' %}
                aria-current="page"
                {% endif %}
            >
                Dashboard
            </a>

            <a
                href="{{ url_for('companies') }}"
                class="app-navigation-link{% if request.url.path.startswith('/companies') %} is-active{% endif %}"
                {% if request.url.path.startswith('/companies') %}
                aria-current="page"
                {% endif %}
            >
                Companies
            </a>

            <a
                href="{{ url_for('my_tasks') }}"
                class="app-navigation-link{% if request.url.path.startswith('/my-tasks') %} is-active{% endif %}"
                {% if request.url.path.startswith('/my-tasks') %}
                aria-current="page"
                {% endif %}
            >
                My Tasks
            </a>

        </div>

    </div>

</nav>

{% endif %}
