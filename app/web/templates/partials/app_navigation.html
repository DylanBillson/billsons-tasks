<nav
    class="app-navigation"
    aria-label="Primary navigation"
>

    <div class="app-navigation-inner">

        {% if current_user %}

        <div class="app-navigation-primary">

            <a
                href="{{ url_for('home') }}"
                class="app-navigation-link{% if request.url.path == '/' %} is-active{% endif %}"
            >
                Dashboard
            </a>

            <a
                href="{{ url_for('companies') }}"
                class="app-navigation-link{% if request.url.path.startswith('/companies') %} is-active{% endif %}"
            >
                Companies
            </a>

            <a
                href="{{ url_for('my_tasks') }}"
                class="app-navigation-link{% if request.url.path.startswith('/my-tasks') %} is-active{% endif %}"
            >
                My Tasks
            </a>

        </div>

        {% endif %}

        {% if current_user and current_user.is_administrator %}

        <div class="app-navigation-secondary">

            <div class="app-navigation-group">

                <span class="app-navigation-group-label">
                    Administration
                </span>

                <a
                    href="{{ url_for('admin_dashboard') }}"
                    class="app-navigation-link{% if request.url.path == '/admin' %} is-active{% endif %}"
                >
                    Overview
                </a>

                <a
                    href="{{ url_for('admin_users') }}"
                    class="app-navigation-link{% if request.url.path.startswith('/admin/users') %} is-active{% endif %}"
                >
                    Users
                </a>

                <a
                    href="{{ url_for('admin_companies') }}"
                    class="app-navigation-link{% if request.url.path.startswith('/admin/companies') %} is-active{% endif %}"
                >
                    Companies
                </a>

                <a
                    href="{{ url_for('admin_archived_companies') }}"
                    class="app-navigation-link{% if request.url.path.startswith('/admin/archived-companies') %} is-active{% endif %}"
                >
                    Archived Companies
                </a>

                <a
                    href="{{ url_for('admin_archived_sections') }}"
                    class="app-navigation-link{% if request.url.path.startswith('/admin/archived-sections') %} is-active{% endif %}"
                >
                    Archived Sections
                </a>

                <a
                    href="{{ url_for('admin_deleted_tasks') }}"
                    class="app-navigation-link{% if request.url.path.startswith('/admin/deleted-tasks') %} is-active{% endif %}"
                >
                    Deleted Tasks
                </a>

                <a
                    href="{{ url_for('admin_audit') }}"
                    class="app-navigation-link{% if request.url.path.startswith('/admin/audit') %} is-active{% endif %}"
                >
                    Audit Log
                </a>

            </div>

        </div>

        {% endif %}

    </div>

</nav>
