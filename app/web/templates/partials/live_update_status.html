<div
    class="live-update-status"
    data-live-update-status
    data-state="idle"
    role="status"
    aria-live="polite"
    aria-atomic="true"
    hidden
>

    <span
        class="live-update-status-indicator"
        aria-hidden="true"
    ></span>

    <span
        class="live-update-status-message"
        data-live-update-status-message
    >
        Checking for updates…
    </span>

    <button
        type="button"
        class="live-update-status-action"
        data-live-update-retry
        hidden
    >
        Try Again
    </button>

</div>
