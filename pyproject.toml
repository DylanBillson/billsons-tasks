[project]
name = "billsons-tasks"
version = "0.1.0"
description = "Billson's Tasks"
readme = "README.md"
requires-python = ">=3.13"

authors = [
    { name = "Dylan Billson" }
]

dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",

    "jinja2==3.1.6",
    "python-multipart==0.0.20",

    "sqlalchemy==2.0.43",
    "alembic==1.16.5",
    "psycopg[binary]==3.2.10",

    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.3.0",

    "pydantic==2.11.9",
    "pydantic-settings==2.11.0",

    "itsdangerous==2.2.0",

    "python-dotenv==1.1.1",

    "httpx==0.28.1",
]

[project.optional-dependencies]

dev = [
    "pytest==8.4.2",
]

[tool.pytest.ini_options]

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

[tool.ruff]

line-length = 100
target-version = "py313"

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]

quote-style = "double"

indent-style = "space"

[build-system]

requires = [
    "setuptools>=75",
]

build-backend = "setuptools.build_meta"